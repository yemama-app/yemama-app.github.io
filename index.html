<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סיפור של יממה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#101c3f; --dusk:#4a3273; --sun:#ffc43d; --sky:#4fb3f6; --grass:#7fd4a3;
  --ink:#1d2246; --ink60:#5b6189; --line:#e3e8f7; --card:#fff; --bg:#eef3ff;
  --ok:#2fb272; --oops:#e8833c; --hour:#ef5d4e; --minute:#2f6fd0; --lock:#aab3cf;
  --r:22px; --shadow:0 10px 30px rgba(29,34,70,.10);
  color-scheme:light;               /* stop dark-mode browsers from repainting controls */
}
/* every control gets explicit ink — dark-mode browsers default button text to white */
button,input,select,textarea{color:var(--ink);font-family:inherit}
input,select,textarea{background:#fff}
.pick{color:var(--ink)}
.pick.on{color:#3a2a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh;
  background:
   radial-gradient(1200px 600px at 85% -10%, #dfeaff 0%, rgba(223,234,255,0) 60%),
   radial-gradient(900px 500px at 0% 100%, #e9fbf1 0%, rgba(233,251,241,0) 60%), var(--bg);
}
.app{max-width:1020px;margin:0 auto;padding:12px 14px 120px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:var(--shadow)}
.who .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#fff4d6,#ffd98a);display:grid;place-items:center;font-size:22px}
.who .nm{font-weight:800;font-size:15px}
.who .gr{font-size:12px;color:var(--ink60);font-weight:700}
.spacer{flex:1}
.pill-btn{height:42px;min-width:42px;padding:0 13px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill-btn:active{transform:scale(.95)}
.starcount{display:flex;align-items:center;gap:5px;background:linear-gradient(140deg,var(--sun),#ff9f4a);color:#3a2a00;font-weight:900;border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:0 6px 16px rgba(255,167,61,.35)}

/* ---------- screens ---------- */
.screen{display:none;animation:in .3s ease both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
h1{font-size:27px;font-weight:900;margin:0 0 6px}
h2{font-size:20px;font-weight:900;margin:0 0 6px}
.lead{color:var(--ink60);font-size:15px;margin:0 0 16px;line-height:1.55}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 20px;cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(29,34,70,.22)}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.go{background:linear-gradient(140deg,#43c47f,#22a765)}
.btn.sun{background:linear-gradient(140deg,var(--sun),#ff9f4a);color:#3a2a00}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{background:#fff8e9;border:2px dashed #ffd98a;border-radius:14px;padding:11px 13px;font-size:14.5px;font-weight:600;color:#8a5a00;margin-top:12px}
.good-box{background:#eafaf1;border:2px solid var(--ok);border-radius:14px;padding:11px 13px;font-weight:700;color:#15764a;margin-top:12px}

/* ---------- onboarding ---------- */
.hero{text-align:center;padding:18px 0 6px}
.hero .big{font-size:62px;line-height:1}
.pickrow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.pick{font:inherit;font-weight:800;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;cursor:pointer;transition:.15s}
.pick:hover{transform:translateY(-2px);border-color:#c9d4f3}
.pick.on{border-color:var(--sun);background:#fff8e8;box-shadow:0 8px 18px rgba(255,180,60,.3)}
.pick.av{font-size:30px;padding:8px 12px;line-height:1}
.name-input{background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:19px;text-align:center;border:2px solid var(--line);border-radius:16px;padding:13px;width:100%;max-width:330px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafcff;border:2px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:9px}
.field label{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.field input,.field select{font:inherit;font-weight:800;font-size:16px;border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;color:var(--ink)}
.field input[type=time]{direction:ltr;text-align:center}

/* ---------- journey map ---------- */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.node{
  position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:15px 14px;
  cursor:pointer;text-align:center;transition:.18s;box-shadow:var(--shadow)
}
.node:hover{transform:translateY(-3px)}
.node .ic{font-size:34px;line-height:1.2}
.node .nm{font-weight:900;font-size:15.5px;margin-top:4px}
.node .st{font-size:12.5px;font-weight:700;color:var(--ink60);margin-top:3px}
.node .badge{position:absolute;top:9px;left:9px;font-size:17px}
.node.done{border-color:var(--ok);background:#f4fcf8}
.node.cur{border-color:var(--sun);background:#fffaf0;box-shadow:0 12px 26px rgba(255,180,60,.3)}
.node.skip{opacity:.65}
.node.lock{opacity:.55;cursor:not-allowed;background:#f7f9ff}
.node.lock .ic{filter:grayscale(1)}
.ladder{display:flex;align-items:center;gap:7px;margin:14px 0 6px;flex-wrap:wrap;font-size:13px;color:var(--ink60);font-weight:700}

/* ---------- level shell ---------- */
.lvl-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lvl-head .t{font-weight:900;font-size:19px;flex:1}
.bar{height:9px;border-radius:99px;background:#e7ecfb;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#43c47f,#22a765);transition:width .4s}
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.task-grid{grid-template-columns:1fr}}
.q{font-weight:900;font-size:19px;margin:0 0 13px;line-height:1.45}
.qmeta{font-size:13px;color:var(--ink60);font-weight:700;margin:0 0 8px}
.opts{display:grid;gap:9px}
.opt{font:inherit;font-weight:700;font-size:16px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s}
.opt:hover{border-color:#c9d4f3;transform:translateY(-1px)}
.opt .tag{width:28px;height:28px;border-radius:9px;background:#f1f4ff;display:grid;place-items:center;font-size:13px;flex:0 0 auto;font-weight:900}
.opt.good{border-color:var(--ok);background:#eafaf1;color:#15764a}
.opt.good .tag{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--oops);background:#fff6ee}

/* ---------- clock widget ---------- */
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.clock-wrap svg{width:100%;max-width:290px;height:auto;touch-action:none;user-select:none;display:block}
.hand{transition:transform .25s cubic-bezier(.4,1.5,.5,1);cursor:grab}
.hand.dragging{transition:none;cursor:grabbing}
.static .hand{cursor:default}
.knob{opacity:.001}
.readout{display:flex;align-items:baseline;gap:10px;justify-content:center;flex-wrap:wrap}
.digital{font-variant-numeric:tabular-nums;font-weight:900;font-size:32px;letter-spacing:1px;background:var(--ink);color:#8ff3c0;padding:6px 15px;border-radius:14px;direction:ltr}
.digital.hide{display:none}
.words{font-weight:700;color:var(--ink60);font-size:15px}
.words.hide{display:none}
.lap{display:flex;gap:6px;background:#f2f5ff;padding:5px;border-radius:999px;border:2px solid var(--line)}
.lap button{font:inherit;font-weight:700;font-size:13px;border:0;background:transparent;color:var(--ink60);padding:8px 12px;border-radius:999px;cursor:pointer}
.lap button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(29,34,70,.12)}
.nudge{display:grid;grid-template-columns:repeat(2,auto);gap:8px;justify-content:center}
.ngroup{display:flex;align-items:center;gap:6px;background:#f6f8ff;border:2px solid var(--line);border-radius:14px;padding:5px 9px}
.ngroup span{font-size:13px;font-weight:700;color:var(--ink60)}
.ngroup button{width:32px;height:32px;border-radius:10px;border:0;background:#fff;box-shadow:0 2px 6px rgba(29,34,70,.12);font-size:17px;font-weight:900;cursor:pointer;color:var(--ink)}
.ngroup button:active{transform:scale(.9)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-2deg) translateX(-5px)}50%{transform:rotate(2deg) translateX(5px)}80%{transform:rotate(-1deg)}}

/* ---------- cycle (24h ring + sky) ---------- */
.ring-panel{display:flex;flex-direction:column;align-items:center}
.daycircle{width:100%;max-width:340px;height:auto;overflow:visible}
.ring-cap{text-align:center;font-size:13px;font-weight:800;color:var(--ink60);margin:2px 0 0}
.seg.no{fill:var(--oops)}
.ring-panel svg{width:100%;max-width:320px;height:auto}
.seg{cursor:pointer;transition:.2s}
.seg.hot{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
.sky{position:relative;height:80px;border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);transition:background .7s linear}
.orb{position:absolute;top:50%;transform:translate(50%,-50%);font-size:32px;transition:right .7s ease,top .7s ease}
.sky .twinkle{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;transition:opacity .8s}
.sky.is-night .twinkle{opacity:.9}
.sky-label{position:absolute;inset:auto 14px 8px auto;color:#fff;font-weight:700;font-size:13px;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ---------- day builder ---------- */
.day-wrap{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}
@media (max-width:860px){.day-wrap{grid-template-columns:1fr}}
.timeline{position:relative;background:#fafcff;border:2px solid var(--line);border-radius:18px;padding:8px 8px 8px 0;overflow:hidden}
.trow{display:flex;align-items:stretch;gap:8px;height:34px}
.trow .hr{width:52px;flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--ink60);direction:ltr;text-align:center;padding-top:1px}
.trow .ln{flex:1;border-top:1px dashed #dde4f7}
.blocks{position:absolute;inset:8px 68px 8px 10px;pointer-events:none}
.blk{position:absolute;right:0;left:0;border-radius:12px;padding:5px 9px;font-weight:800;font-size:13.5px;color:#fff;display:flex;align-items:center;gap:7px;overflow:hidden;pointer-events:auto;box-shadow:0 5px 14px rgba(29,34,70,.18)}
.blk small{font-weight:700;opacity:.9;font-variant-numeric:tabular-nums;direction:ltr}
.blk.clash{outline:3px solid var(--oops);outline-offset:-3px;animation:shake .45s}
.blk.host{align-items:flex-start}
.blk.nested{margin-inline-start:20px;border:2px solid rgba(255,255,255,.6);box-shadow:0 3px 10px rgba(29,34,70,.22)}
.blk .x{margin-inline-start:auto;background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:8px;width:22px;height:22px;cursor:pointer;font-weight:900;line-height:1}
.cardbank{display:flex;flex-direction:column;gap:8px}
.abtn{display:flex;align-items:center;gap:9px;border:2px solid var(--line);background:#fff;border-radius:15px;padding:10px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-align:right}
.abtn:hover{border-color:#c9d4f3;transform:translateY(-2px)}
.abtn .e{font-size:23px}
.abtn .dur{margin-inline-start:auto;font-size:12px;color:var(--ink60);font-weight:700}
.abtn.used{opacity:.45;pointer-events:none}
.summary{display:grid;gap:7px;margin-top:12px}
.sline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:#f7f9ff;border-radius:12px;padding:9px 11px}
.sline.warn{background:#fff6ee;color:#8a4a0a}
.sline.ok{background:#f1fbf6;color:#15764a}
.sline.ask{background:#fff8f0;color:#7a4e12}
.modal{position:fixed;inset:0;background:rgba(16,22,52,.55);display:none;place-items:center;z-index:60;padding:14px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:24px;padding:18px;max-width:380px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}

/* ---------- parent ---------- */
.ptable{width:100%;border-collapse:collapse;font-size:14.5px}
.ptable th,.ptable td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
.ptable th{color:var(--ink60);font-size:13px}
.tag-ok{background:#eafaf1;color:#15764a;border-radius:8px;padding:3px 8px;font-weight:800;font-size:12.5px}
.tag-no{background:#f3f5fc;color:var(--ink60);border-radius:8px;padding:3px 8px;font-weight:800;font-size:12.5px}

/* ---------- guide ---------- */
.guide{position:fixed;inset:auto 0 10px;margin:0 auto;max-width:1020px;padding:0 14px;display:flex;align-items:flex-end;gap:10px;z-index:20;pointer-events:none}
.owl{width:54px;height:54px;border-radius:50%;background:linear-gradient(140deg,#fff,#eaf1ff);border:3px solid #fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.bubble{background:var(--ink);color:#fff;border-radius:20px 20px 20px 6px;padding:12px 15px;font-weight:700;font-size:15px;box-shadow:var(--shadow);line-height:1.5;flex:1}
.bubble.pop{animation:bpop .32s ease}
@keyframes bpop{from{transform:scale(.95);opacity:.5}to{transform:none;opacity:1}}
body.older .owl{display:none}
body.older .bubble{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:16px;font-size:14.5px}
body.young .q{font-size:21px}
body.young .opt{font-size:17.5px;padding:16px}
.toast{position:fixed;inset:14px 0 auto;margin:0 auto;width:max-content;max-width:90%;background:var(--ok);color:#fff;font-weight:800;padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px rgba(47,178,114,.45);z-index:70;animation:toast 1.9s ease forwards}
.toast.oops{background:var(--oops)}
@keyframes toast{0%{transform:translateY(-24px);opacity:0}15%,70%{transform:none;opacity:1}100%{transform:translateY(-14px);opacity:0}}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:69;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.2}}
.print-only{display:none}
@media print{body{background:#fff}.app,.guide{display:none}.print-only{display:block;padding:12px}
  .prow{display:flex;align-items:center;gap:12px;border:1px solid #bbb;border-radius:14px;padding:9px;margin-bottom:7px;break-inside:avoid}
  .prow .t{font-weight:900;font-size:19px;direction:ltr}}
/* ---------- pies / 12+12 line / digital ---------- */
.pies{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:6px 0 16px}
.pie{text-align:center}
.pie .pl{font-weight:800;font-size:14px;margin-top:4px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:#fafcff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.tl-lab{font-size:12.5px;font-weight:800;color:var(--ink60);white-space:nowrap}
.tl-row{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.tl-row span{text-align:center;font-weight:800;font-size:14px;border-radius:8px;padding:5px 0;background:#fff;border:1.5px solid var(--line);font-variant-numeric:tabular-nums;transition:.2s}
.tl-row span.col{background:#fff8e8;border-color:#ffd98a}
.tl-row span.on{background:var(--sun);border-color:var(--sun);color:#3a2a00;transform:scale(1.14)}
@media (max-width:520px){.tl-row span{font-size:11px;padding:4px 0}.tl-lab{font-size:11px}}
.digi{direction:ltr;display:inline-grid;grid-template-columns:auto auto auto;gap:2px 4px;align-items:center;justify-items:center;background:var(--ink);border-radius:20px;padding:12px 16px 14px;box-shadow:var(--shadow);margin:10px auto}
.digi .lab{font-size:13px;font-weight:800;color:#9fb0da}
.digi b{font-size:58px;font-weight:900;color:#8ff3c0;font-variant-numeric:tabular-nums;border-radius:14px;padding:0 10px;cursor:pointer;transition:.2s;line-height:1.15}
.digi b:hover{background:rgba(143,243,192,.1)}
.digi b.ok{background:rgba(47,178,114,.35)}
.digi b.no{background:rgba(232,131,60,.4)}
.digi i{font-style:normal;font-size:50px;color:#8ff3c0;font-weight:900}
.digi.tick b{animation:tick .45s ease}
@keyframes tick{0%{transform:translateY(-8px);opacity:.3}100%{transform:none;opacity:1}}
/* ---------- the day as a line (00 → 23) ---------- */
.dline-wrap{overflow-x:auto;padding:8px 2px 4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.dline{display:grid;grid-template-columns:repeat(24,minmax(36px,1fr));gap:3px;min-width:880px}
.lc{border:0;border-radius:10px;padding:4px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;transition:.15s}
.lc.d{background:#dff1ff;color:var(--ink)}
.lc.n{background:#26346b;color:#fff}
.lc b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.lc small{font-size:13px;min-height:17px}
.lc:hover{transform:translateY(-2px)}
.lc.on{background:var(--sun);color:#3a2a00;transform:scale(1.13)}
.lc.no{background:var(--oops);color:#fff}
.dline-cap{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink60);margin-top:7px;min-width:880px}
.tline.tap span{cursor:pointer}
.tline.tap span:hover{background:#fff8e8}
.tline span.no{background:var(--oops);color:#fff;border-color:var(--oops)}
/* ---------- digital time picker ---------- */
.dpick{direction:ltr;display:flex;justify-content:center;align-items:center;gap:10px;background:var(--ink);border-radius:20px;padding:12px 18px;margin:10px auto;width:max-content}
.dpick .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.dpick b{font-size:52px;color:#8ff3c0;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.dpick i{font-style:normal;font-size:46px;color:#8ff3c0;font-weight:900;margin-top:18px}
.dpick button{width:58px;height:36px;border-radius:11px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:16px;cursor:pointer}
.dpick button:active{transform:scale(.92)}
.dpick .lab{font-size:12.5px;color:#9fb0da;font-weight:800}
.pickwords{text-align:center;font-weight:800;color:var(--ink60);margin-bottom:6px}
/* ---------- parent gate + tester mode ---------- */
.devpill{background:#ffe3d6;color:#9a3a10;border:2px solid #ffb48f;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}
.devpill[hidden]{display:none}
.devbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff3e8;border:2px dashed #ffb48f;color:#8a4a0a;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:14px}
.devbar span{flex:1;min-width:220px}
.devtools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;width:100%;margin-top:4px}
.devtools .btn{padding:8px 11px;font-size:13px;box-shadow:none}
.devtools select{font:inherit;font-weight:700;font-size:13.5px;border:2px solid #ffb48f;border-radius:10px;padding:6px 8px;background:#fff;color:var(--ink)}
.node.open{border-color:#c9d4f3}
/* v11 — numbered stations, "start here", separate bonus row, one big start button for grades 1–2 */
.node .num{position:absolute;top:8px;right:10px;min-width:22px;height:22px;line-height:22px;border-radius:999px;background:#eef2ff;color:var(--ink60);font-weight:900;font-size:13px;text-align:center}
.node.cur .num{background:var(--sun);color:#3a2a00}
.node.cur .st{color:#9a5b00;font-weight:900}
#mapStart .btn{font-size:20px;padding:16px 18px}
#mapBonus{margin-top:16px}
#mapBonus .bonus-t{font-weight:900;color:var(--ink60);font-size:14px;margin:0 2px 8px}
.btn.start{font-size:21px;padding:18px}

  /* כפתור 🔊 קורא את הטקסט המקורי (כתיב מלא), לא את המנוקד — "בַּבֹּקֶר" בלי ניקוד הוא "בבקר" */
  for(const qn of [node,...node.querySelectorAll(".q")]) if(qn.classList&&qn.classList.contains("q")&&!qn.dataset.say) qn.dataset.say=qn.textContent.replace("🔊","");
  for(const t of list){ const v=nqText(t.nodeValue); if(v!==t.nodeValue) t.nodeValue=v; }
  return node;
}
const el = (tag, cls, html)=>{ const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=gx(html);

    const b=document.createElement("button"); b.className="say-btn"; b.type="button"; b.textContent="🔊"; b.title="הקראה";
    b.onclick=e=>{ e.stopPropagation(); speak((n.dataset.say||n.textContent).replace("🔊",""),true); }; n.appendChild(b); } }catch(e){} }
  return n; };

const HNAME = ["שתים־עשרה","אחת","שתיים","שלוש","ארבע","חמש","שש","שבע","שמונה","תשע","עשר","אחת־עשרה"];
function partOfDay(h){
  if(h===0) return "בלילה";
  if(h<5) return "לפנות בוקר";
  if(h<12) return "בבוקר";
  if(h===12) return "בצהריים";
  if(h<18) return "אחר הצהריים";
  if(h<21) return "בערב";
  return "בלילה";
}
function words(h,m){
  if(h===0&&m===0) return "חצות — יום חדש מתחיל";
  if(h===12&&m===0) return "שתים־עשרה בצהריים";
  const n = HNAME[h%12], p = partOfDay(h);
  if(m===0)  return n+" "+p;
  if(m===15) return n+" ורבע "+p;
  if(m===30) return n+" וחצי "+p;
  if(m===45) return "רבע ל"+HNAME[(h+1)%12]+" "+partOfDay((h+1)%24);
  return n+" ו־"+m+" דקות "+p;
}
function say(text){

  try{ if(voiceMode()==="auto") speak(b.textContent); }catch(e){}
  b.classList.remove("nq"); nqEl(b);                                   /* ניקוד לתצוגה בלבד — ההקראה כבר קיבלה את הטקסט הרגיל */
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
}
function toast(text, bad=false){

  setTimeout(()=>t.remove(),2000);

function confetti(){

}
const SVGNS="http://www.w3.org/2000/svg";
function svgEl(t,attrs){ const n=document.createElementNS(SVGNS,t); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function polar(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }

/* =====================================================================
   CLOCK
   ===================================================================== */
class Clock{
  constructor(host,{interactive=true, inner=true, onSettle=null, readout=true, lap=true}={}){
    this.host=host; this.interactive=interactive; this.onSettle=onSettle;
    this.h=7; this.m=0; this.drag=null;
    host.classList.add("clock-wrap"); host.innerHTML="";

    const svg=svgEl("svg",{viewBox:"0 0 300 300"}); this.svg=svg;
    svg.appendChild(svgEl("circle",{cx:150,cy:150,r:144,fill:"#f4f7ff"}));
    svg.appendChild(svgEl("circle",{cx:150,cy:150,r:136,fill:"#fff",stroke:"#dde4f7","stroke-width":4}));

    for(let i=0;i<60;i++){
      const big=i%5===0, [x1,y1]=polar(150,150,big?126:130,i*6), [x2,y2]=polar(150,150,134,i*6);
      svg.appendChild(svgEl("line",{x1,y1,x2,y2,stroke:big?"#9fb0da":"#dde4f7","stroke-width":big?3.5:2,"stroke-linecap":"round"}));
    }
    for(let n=1;n<=12;n++){
      const [x,y]=polar(150,150,108,n*30);
      const t=svgEl("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":27,"font-weight":900,fill:"#1d2246","font-family":"Rubik, sans-serif"});
      t.textContent=n; svg.appendChild(t);
      if(inner){
        const [xi,yi]=polar(150,150,80,n*30);
        const ti=svgEl("text",{x:xi,y:yi,"text-anchor":"middle","dominant-baseline":"central","font-size":15,"font-weight":700,fill:"#b0485e","font-family":"Rubik, sans-serif"});
        ti.textContent=n+12; svg.appendChild(ti);
      }
    }

    this.hourG=svgEl("g",{class:"hand"});
    this.hourG.appendChild(svgEl("line",{x1:150,y1:162,x2:150,y2:76,stroke:"var(--hour)","stroke-width":14,"stroke-linecap":"round"}));
    this.hourG.appendChild(svgEl("circle",{cx:150,cy:76,r:11,fill:"var(--hour)"}));
    this.hourG.appendChild(svgEl("circle",{class:"knob",cx:150,cy:88,r:34,fill:"#000"}));
    svg.appendChild(this.hourG);

    this.minG=svgEl("g",{class:"hand"});
    this.minG.appendChild(svgEl("line",{x1:150,y1:164,x2:150,y2:38,stroke:"var(--minute)","stroke-width":8,"stroke-linecap":"round"}));
    this.minG.appendChild(svgEl("circle",{cx:150,cy:38,r:9,fill:"var(--minute)"}));
    this.minG.appendChild(svgEl("circle",{class:"knob",cx:150,cy:48,r:28,fill:"#000"}));
    svg.appendChild(this.minG);

    svg.appendChild(svgEl("circle",{cx:150,cy:150,r:9,fill:"#1d2246"}));
    host.appendChild(svg);

    if(readout){
      const ro=el("div","readout");
      this.dig=el("div","digital","07:00"); this.wrd=el("div","words","");
      ro.append(this.dig,this.wrd); host.appendChild(ro);
    }
    if(interactive && lap){
      const lap=el("div","lap");
      this.amBtn=el("button",null,"🌅 לפני הצהריים · 00–11");
      this.pmBtn=el("button",null,"🌇 אחרי הצהריים · 12–23");
      this.amBtn.onclick=()=>this.setLap("am"); this.pmBtn.onclick=()=>this.setLap("pm");
      lap.append(this.amBtn,this.pmBtn); host.appendChild(lap);
    }
    if(interactive){

      const nudge=el("div","nudge");
      nudge.append(this.mkGroup("שעה",1), this.mkGroup("דקות",5));
      host.appendChild(nudge);
      this.bindDrag();
    }
    if(!interactive) host.classList.add("static");
    this.render();
  }
  mkGroup(label,step){
    const g=el("div","ngroup");
    const minus=el("button",null,"−"), plus=el("button",null,"+"), s=el("span",null,label);
    const bump=(dir)=>{
      if(step===1) this.h=(this.h+dir+24)%24;
      else { this.m=(this.m+dir*step+60)%60; }
      SFX.tick(); this.render(); this.settle();
    };
    minus.onclick=()=>bump(-1); plus.onclick=()=>bump(1);
    g.append(minus,s,plus); return g;
  }
  setLap(l){
    const h12=this.h%12;
    this.h = l==="am" ? h12 : h12+12;
    SFX.tick(); this.render(); this.settle();
  }
  bindDrag(){
    const start=(which)=>(e)=>{
      if(!this.interactive) return;
      e.preventDefault(); this.drag=which;
      (which==="h"?this.hourG:this.minG).classList.add("dragging");
      this.svg.setPointerCapture?.(e.pointerId);
    };
    this.hourG.addEventListener("pointerdown",start("h"));
    this.minG.addEventListener("pointerdown",start("m"));
    this.svg.addEventListener("pointermove",(e)=>{
      if(!this.drag) return;
      const r=this.svg.getBoundingClientRect();
      const dx=(e.clientX-r.left)-r.width/2, dy=(e.clientY-r.top)-r.height/2;
      if(Math.hypot(dx,dy)<14) return;
      let a=Math.atan2(dx,-dy)*180/Math.PI; if(a<0)a+=360;
      if(this.drag==="h"){
        const h12=Math.round(a/30)%12;
        const pm=this.h>=12;
        const nh=pm?h12+12:h12;
        if(nh!==this.h){ this.h=nh; SFX.tick(); }
      }else{
        const nm=(Math.round(a/30)*5)%60;
        if(nm!==this.m){ this.m=nm; SFX.tick(); }
      }
      this.render();
    });
    const end=()=>{
      if(!this.drag) return;
      this.hourG.classList.remove("dragging"); this.minG.classList.remove("dragging");
      this.drag=null; this.settle();
    };
    this.svg.addEventListener("pointerup",end);
    this.svg.addEventListener("pointercancel",end);
    window.addEventListener("pointerup",end);
  }
  settle(){ this.onSettle && this.onSettle(this.h,this.m); }
  set(h,m=0,fire=false){ this.h=((h%24)+24)%24; this.m=((m%60)+60)%60; this.render(); if(fire) this.settle(); }
  render(){
    const ha=((this.h%12)+this.m/60)*30, ma=this.m*6;
    this.hourG.setAttribute("transform",`rotate(${ha} 150 150)`);
    this.minG.setAttribute("transform",`rotate(${ma} 150 150)`);
    if(this.dig){ this.dig.textContent=pad(this.h)+":"+pad(this.m); this.wrd.textContent=words(this.h,this.m); }
    if(this.amBtn){
      const pm=this.h>=12;
      this.amBtn.classList.toggle("on",!pm); this.pmBtn.classList.toggle("on",pm);
    }
  }
}

/* mini static clock for the printable schedule */
function miniClock(h,m,size=64){
  const ha=((h%12)+m/60)*30, ma=m*6;
  const night = (h>=20||h<6);
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">
    <circle cx="50" cy="50" r="47" fill="${night?"#1d2b63":"#fff8e1"}" stroke="#1d2246" stroke-width="3"/>
    ${[12,3,6,9].map(n=>{const[x,y]=polar(50,50,36,n*30);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="${night?"#cfe0ff":"#1d2246"}" font-family="Rubik, sans-serif">${n}</text>`;}).join("")}
    <g transform="rotate(${ha} 50 50)"><line x1="50" y1="55" x2="50" y2="28" stroke="#ef5d4e" stroke-width="6" stroke-linecap="round"/></g>
    <g transform="rotate(${ma} 50 50)"><line x1="50" y1="56" x2="50" y2="15" stroke="#2f6fd0" stroke-width="4" stroke-linecap="round"/></g>
    <circle cx="50" cy="50" r="4" fill="#1d2246"/>
  </svg>`;
}

/* ---------- levels: reading & setting the clock ---------- */
const POOL={round:[0], half:[0,30], quarter:[0,15,30,45], five:[0,5,10,15,20,25,30,35,40,45,50,55]};
function genTime(mode){
  const p=POOL[mode], m=p[Math.floor(Math.random()*p.length)];
  const h=1+Math.floor(Math.random()*12);
  return (mode!=="round"&&m===0) ? genTime(mode) : {h,m};
}
function lvClock(mode){
  const host=$("#levelBody"); host.innerHTML="";
  const N=6; LV.n=N;
  const grid=el("div","task-grid");
  const left=el("div"), right=el("div","clock-wrap");
  grid.append(left,right); host.appendChild(grid);
  let clock=null, target=null, mistakes=0, hintT=null, qStart=0;

  function fresh(interactive){
    right.innerHTML="";
    clock=new Clock(right,{interactive,inner:false,readout:false,lap:false,onSettle:interactive?checkSet:null});
  }
  function draw(){
    if(LV.i>=N){ host.innerHTML=""; 
      return levelDone(`סיימת את השלב! ${LV.score} מתוך ${N} בניסיון ראשון.`); }
    setBar(LV.i/N); mistakes=0; left.innerHTML="";
    target=genTime(mode); qStart=Date.now();
    const isRead = LV.i%2===0;
    left.appendChild(el("p","qmeta",`משימה ${LV.i+1} מתוך ${N}`));
    if(isRead){
      fresh(false); clock.set(target.h,target.m);
      left.appendChild(el("p","q","איזו שעה מראה השעון?"));
      const opts=el("div","opts");
      const alts=[];
      while(alts.length<2){
        const a=genTime(mode);
        if(!(a.h===target.h&&a.m===target.m) && !alts.some(x=>x.h===a.h&&x.m===a.m)) alts.push(a);
      }
      [...alts,target].sort(()=>Math.random()-.5).forEach((o,i)=>{
        const b=el("button","opt",`<span class="tag">${["א","ב","ג"][i]}</span>${pad(o.h)}:${pad(o.m)} · ${shortWords(o.h,o.m)}`);
        b.onclick=()=>{
          if(o.h===target.h&&o.m===target.m){
            b.classList.add("good"); SFX.ok(); track("read_"+mode,!mistakes,false,mistakes,(Date.now()-qStart)/1000);
            if(!mistakes) LV.score++; LV.i++; setTimeout(draw,750);
          }else{
            b.classList.add("bad"); SFX.oops(); mistakes++;
            say(mistakes===1 ? "כמעט. הסתכלי קודם על המחוג הקצר — על איזה מספר הוא עבר?"
                             : `רמז: המחוג הקצר אחרי ה־${target.h}, והארוך מראה ${target.m} דקות.`);
            setTimeout(()=>b.classList.remove("bad"),800);
          }
        };
        opts.appendChild(b);
      });
      left.appendChild(opts);
      say("איזו שעה מראה השעון?");
    }else{
      fresh(true);
      const s=genTime(mode); clock.set(s.h===target.h?(s.h%12)+1:s.h, 0);
      left.appendChild(el("p","q",`כווני את השעון ל־${pad(target.h)}:${pad(target.m)} — ${shortWords(target.h,target.m)}`));
      const hb=el("button","btn ghost","רמז 💡");
      hb.onclick=()=>{ mistakes++; say(hintFor(target)); };
      const r=el("div","btn-row"); r.appendChild(hb); left.appendChild(r);
      say(`כווני את השעון ל־${shortWords(target.h,target.m)}.`);
    }
  }
  function hintFor(t){
    if(t.m===0) return `💡 המחוג הקצר על ה־${t.h}, והארוך על ה־12.`;
    if(t.m===30) return `💡 המחוג הארוך על ה־6 (חצי סיבוב), והקצר בדיוק באמצע הדרך אחרי ה־${t.h}.`;
    if(t.m===15) return `💡 רבע שעה = המחוג הארוך על ה־3.`;
    if(t.m===45) return `💡 רבע ל = המחוג הארוך על ה־9, והקצר כמעט הגיע ל־${(t.h%12)+1}.`;
    return `💡 כל מספר בשעון = 5 דקות. ${t.m} דקות = המחוג הארוך על ה־${t.m/5}.`;
  }
  function checkSet(h,m){
    clearTimeout(hintT);
    if(h%12===target.h%12 && m===target.m){
      SFX.ok(); track("set_clock",!mistakes,mistakes>0,mistakes,(Date.now()-qStart)/1000);
      if(!mistakes) LV.score++; LV.i++; setTimeout(draw,700);
    }else hintT=setTimeout(()=>{ mistakes++; say(hintFor(target)); },2600);
  }
  if(mode==="half"||mode==="quarter") pieIntro(mode,()=>{ host.innerHTML=""; host.appendChild(grid); draw(); });
  else draw();
}

const T0=6*60, T1=24*60, ROW=34;
const toMin=t=>{ const [h,m]=t.split(":").map(Number); return h*60+m; };
const toHM=n=>pad(Math.floor(n/60)%24)+":"+pad(n%60);
/* פעילות שנמצאת כולה בתוך פעילות ארוכה יותר אינה התנגשות — זה יום נורמלי.

const span=x=>{ const s=toMin(x.time); return [s, s+x.duration_minutes]; };
function within(a,b){
  const [as,ae]=span(a), [bs,be]=span(b);
  return a.duration_minutes < b.duration_minutes && as>=bs && ae<=be;
}
function clashes(list){
  const bad=new Set();
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i], b=list[j], [as,ae]=span(a), [bs,be]=span(b);
    if(!(as<be && bs<ae)) continue;            /* לא נוגעות בכלל */
    if(within(a,b)||within(b,a)) continue;     /* אחת יושבת כולה בתוך השנייה — בסדר גמור */
    bad.add(a.activity); bad.add(b.activity);  /* חפיפה חלקית בלבד */

function nesting(list){

function sleepHours(list){

      clock=new Clock(right,{interactive:false,inner:true,readout:false}); clock.set(target.h,target.m);
      const alts=[]; while(alts.length<2){ const a=genTime(reached); if(!(a.h===target.h&&a.m===target.m)&&!alts.some(x=>x.h===a.h&&x.m===a.m)) alts.push(a); }
      q.q="איזו שעה מראה השעון?";
      q.o=[...alts.map(a=>[`${pad(a.h)}:${pad(a.m)} · ${shortWords(a.h,a.m)}`,false]),[`${pad(target.h)}:${pad(target.m)} · ${shortWords(target.h,target.m)}`,true]].sort(()=>Math.random()-.5);
      q.h="רמז: קודם המחוג הקצר — השעה. אחר כך הארוך — הדקות.";
    }
    if(q.t==="set"){
      target=genTime(reached);
      clock=new Clock(right,{interactive:true,inner:false,readout:false,lap:false,onSettle:(h,m)=>{
        if(h%12===target.h%12&&m===target.m){ SFX.ok(); if(!mistakes) LV.score++; LV.i++; setTimeout(draw,800); }
      }});
      clock.set((target.h%12)+3,0);
      left.appendChild(el("p","q",`משימה אחרונה: כווני את השעון ל־${pad(target.h)}:${pad(target.m)}.`));
      const hb=el("button","btn ghost","רמז 💡"); hb.onclick=()=>{ mistakes++; say(`💡 המחוג הקצר ליד ה־${target.h}, הארוך על ה־${target.m?target.m/5:12}.`); };
      const r=el("div","btn-row"); r.appendChild(hb); left.appendChild(r);
      say("משימה אחרונה — כווני את השעון בעצמך.");
      return;
    }
    if(q.t!=="read"){ const w=el("div","hero",`<div class="big">${["","⏰","🌗","🌆","🌙"][LV.i]||"🕐"}</div>`); right.appendChild(w); }
    left.appendChild(el("p","q",q.q));
    const opts=el("div","opts");
    q.o.forEach(([t,ok],i)=>{
      const b=el("button","opt",`<span class="tag">${["א","ב","ג"][i]}</span>${t}`);
      b.onclick=()=>{
        if(ok){ b.classList.add("good"); SFX.ok(); if(!mistakes) LV.score++; LV.i++; setTimeout(draw,700); }
        else{ b.classList.add("bad"); SFX.oops(); mistakes++; say(q.h); setTimeout(()=>b.classList.remove("bad"),700); }
      };
      opts.appendChild(b);
    });
    left.appendChild(opts); say(q.q);
  }
  draw();
}

/* =====================================================================
   Moti's method, from the hand sketches:
   (1) the clock as a pie  (2) 24 = 12 + 12  (3) digital hours|minutes + roll-over
   ===================================================================== */
function mcq(box,opts,hint,onRight,skill){
  const t0=Date.now(), sk=skill!==undefined?skill:(LV&&LV.skill);
  const wrap=el("div","opts"); let miss=0, done=false;
  opts.forEach(([t,ok],i)=>{
    const b=el("button","opt",`<span class="tag">${["א","ב","ג","ד"][i]}</span>${t}`);
    b.onclick=()=>{
      if(done) return;
      if(ok){ done=true; b.classList.add("good"); SFX.ok(); track(sk,miss===0,false,miss,(Date.now()-t0)/1000); onRight(miss===0); }
      else { b.classList.add("bad"); SFX.oops(); miss++; say(hint); setTimeout(()=>b.classList.remove("bad"),700); }
    };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
}

/* ---------- (1) pie ---------- */
function pieSVG(frac,label,size=104){
  let fill;
  if(frac>=1) fill=`<circle cx="50" cy="50" r="44" fill="#ffd166"/>`;
  else{ const a=frac*360, [x,y]=polar(50,50,44,a);
    fill=`<path d="M50 50 L50 6 A44 44 0 ${a>180?1:0} 1 ${x} ${y} Z" fill="#ffd166"/>`; }
  const [hx,hy]=polar(50,50,40,frac>=1?0:frac*360);
  const nums=[12,3,6,9].map(n=>{ const [x,y]=polar(50,50,33,n*30%360);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" fill="#1d2246" font-family="Rubik,sans-serif">${n}</text>`; }).join("");
  return `<div class="pie"><svg viewBox="0 0 100 100" width="${size}" height="${size}">
    <circle cx="50" cy="50" r="44" fill="#fff" stroke="#1d2246" stroke-width="3"/>${fill}${nums}
    <line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#2f6fd0" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3.5" fill="#1d2246"/></svg><div class="pl">${label}</div></div>`;
}

    : ["שלושה רבעים — כמה דקות זה?", [["30",false],["45",true],["60",false]], "רמז: 15 + 15 + 15."];
  qb.appendChild(el("p","qmeta","לפני שמתחילים"));
  qb.appendChild(el("p","q",q));

/* ---------- (2) 24 = 12 + 12 ---------- */
function twelveLine(H,tap=false){
  const col = H==null?-1:(H===0?12:(H>12?H-12:H)), bottom=(H===0||H>12);
  let top="",bot="";
  for(let k=1;k<=12;k++){
    top+=`<span data-h="${k}" class="${col===k?"col":""}${col===k&&!bottom?" on":""}">${k}</span>`;
    bot+=`<span data-h="${k===12?0:k+12}" class="${col===k?"col":""}${col===k&&bottom?" on":""}">${k===12?"00":k+12}</span>`;
  }
  return `<div class="tline${tap?" tap":""}"><div class="tl-lab">☀️ 1–12</div><div class="tl-row">${top}</div>
          <div class="tl-lab">🌙 13–00</div><div class="tl-row">${bot}</div></div>`;
}
function lvTwelve(){
  const host=$("#levelBody"); host.innerHTML="";
  host.appendChild(el("p","lead","ביממה יש 24 שעות = 12 + 12. אחרי 12 בצהריים ממשיכים לספור: 13, 14, 15… ו־13 זה בעצם 1 — אחת אחר הצהריים. ככה גם 19: 19 פחות 12 = 7. 19 = שבע בערב."));
  const top=el("div","qtop"); host.appendChild(top);           /* v11: ההוראה מעל השורות */
  const lineHost=el("div"); host.appendChild(lineHost);
  const grid=el("div","task-grid"), left=el("div"), right=el("div","clock-wrap");
  grid.append(left,right); host.appendChild(grid);
  const KINDS=["toTwelve","toDigital","say","roll12","tapName","roll24"]; LV.n=KINDS.length;
  const rH=()=>13+Math.floor(Math.random()*11);
  const next=first=>{ if(first) LV.score++; LV.i++; setTimeout(draw,750); };
  let tapH=null, tapMiss=0;
  lineHost.addEventListener("click",e=>{
    const sp=e.target.closest(".tline.tap span"); if(!sp||tapH==null) return;
    const h=+sp.dataset.h;
    if(h===tapH){ sp.classList.add("on"); SFX.ok(); track("twelve",tapMiss===0,false,tapMiss,0); say(`נכון! ${words(tapH,0)} = ${pad(tapH)}:00.`); tapH=null; next(tapMiss===0); }
    else{ sp.classList.add("no"); SFX.oops(); tapMiss++;
      say(`רמז: ${tapH-12} אחר הצהריים — בשורה התחתונה, מתחת ל־${tapH-12}.`); setTimeout(()=>sp.classList.remove("no"),600); }
  });
  const hero=e=>`<div class="hero"><div class="big">${e}</div></div>`;
  function draw(){
    if(LV.i>=KINDS.length){ grid.remove(); lineHost.remove(); top.remove();
      return levelDone("עכשיו את יודעת: 13 זה 1, 14 זה 2… ואחרי 23:59 מגיע 00:00 — יום חדש."); }
    setBar(LV.i/KINDS.length); top.innerHTML=""; left.innerHTML=""; right.innerHTML="";
    const kind=KINDS[LV.i];
    top.appendChild(el("p","qmeta",`משימה ${LV.i+1} מתוך ${KINDS.length}`));
    let H;
    if(kind==="toTwelve"){
      H=rH(); lineHost.innerHTML=twelveLine(H); right.innerHTML=digiBox(H,0);
      top.appendChild(el("p","q",`השעה ${H}:00. איזו שעה זו אם סופרים רק עד 12?`));
      mcq(left,shuffle([[String(H-12),true],[String(H-10),false],[String(H),false]]),
          `רמז: תסתכלי בשורה — מה עומד מעל ${H}? או: ${H} פחות 12.`,next);
      say("תסתכלי בשורה: מה עומד מעל המספר הצהוב?");
    }
    else if(kind==="toDigital"){
      H=rH(); lineHost.innerHTML=twelveLine(H); right.innerHTML=hero("🔢");
      top.appendChild(el("p","q",`${words(H,0)} — איך כותבים את זה בשעון דיגיטלי?`));
      mcq(left,shuffle([[`${pad(H)}:00`,true],[`${pad(H-12)}:00`,false],[`${pad(H-1)}:00`,false]]),
          `רמז: אחרי הצהריים מוסיפים 12. ${H-12} ועוד 12 = ?`,next);
      say("אחרי 12 בצהריים — מוסיפים 12.");
    }
    else if(kind==="say"){
      H=14+Math.floor(Math.random()*8); lineHost.innerHTML=twelveLine(H); right.innerHTML=digiBox(H,0);
      top.appendChild(el("p","q",`${pad(H)}:00 — איך אומרים את השעה הזאת?`));
      const alt=H+1<=23?H+1:H-2;
      mcq(left,shuffle([[words(H,0),true],[words(H-12,0),false],[words(alt,0),false]]),
          "רמז: מחסירים 12 כדי לדעת איזו שעה — ואחרי 12 זה אחר הצהריים, ערב או לילה.",next);
    }
    else if(kind==="tapName"){
      H=rH(); tapH=H; tapMiss=0; lineHost.innerHTML=twelveLine(null,true); right.innerHTML=hero("👆");
      top.appendChild(el("p","q",`לחצי בשורות על השעה: "${words(H,0)}".`));
      say(`איפה ${words(H,0)}? לחצי על המספר.`);
    }
    else{
      const [a,b] = kind==="roll12" ? [[12,59],[13,0]] : [[23,59],[0,0]];
      lineHost.innerHTML=twelveLine(b[0]); right.innerHTML=digiBox(a[0],a[1]);
      top.appendChild(el("p","q",`השעה ${pad(a[0])}:${pad(a[1])}. מה השעה דקה אחרי?`));
      const opts = kind==="roll12" ? [["12:60",false],["13:00",true],["00:00",false]]
                                   : [["23:60",false],["00:00",true],["12:00",false]];
      mcq(left,shuffle(opts), kind==="roll12"
          ? "רמז: אין 60 דקות — אחרי 59 מתחילה שעה חדשה, והדקות חוזרות ל־00."
          : "רמז: אחרי 23:59 היממה נגמרת — ומתחיל יום חדש.",
        first=>{ right.innerHTML=digiBox(b[0],b[1]); right.querySelector(".digi").classList.add("tick");
          say(kind==="roll12"?"12:59 ועוד דקה = 13:00.":"23:59 ועוד דקה = 00:00 — חצות, יום חדש!"); next(first); });
    }
  }
  draw();
}

/* ---------- (3) digital: hours | minutes, minute by minute, roll-over ---------- */
function digiBox(h,m){
  return `<div class="digi"><span class="lab">שעות</span><span></span><span class="lab">דקות</span>
          <b class="dh">${pad(h)}</b><i>:</i><b class="dm">${pad(m)}</b></div>`;
}
function lvDigital(){
  const host=$("#levelBody"); host.innerHTML="";
  host.appendChild(el("p","lead","בשעון דיגיטלי יש שני חלקים: משמאל השעות, מימין הדקות. כל דקה — המספר הימני עולה ב־1. ואחרי 59 מתחילה שעה חדשה."));
  const grid=el("div","task-grid"), left=el("div"), right=el("div","clock-wrap");
  grid.append(left,right); host.appendChild(grid);
  const KINDS=["parts","plus1","plus10","roll","roll","roll24","play"]; LV.n=KINDS.length-1;
  const next=first=>{ if(first) LV.score++; LV.i++; setTimeout(draw,800); };
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  let rollHours=shuffle([7,8,9,10]).slice(0,2);
  function draw(){
    if(LV.i>=KINDS.length){ grid.remove();
      return levelDone("את קוראת שעון דיגיטלי: שעות משמאל, דקות מימין, ואחרי 59 — שעה חדשה."); }
    setBar(LV.i/KINDS.length); left.innerHTML=""; right.innerHTML="";
    const kind=KINDS[LV.i];
    if(kind!=="play") left.appendChild(el("p","qmeta",`משימה ${LV.i+1} מתוך ${KINDS.length-1}`));
    const show=(h,m)=>{ right.innerHTML=digiBox(h,m); };
    const after=(h,m)=>{ show(h,m); right.querySelector(".digi").classList.add("tick"); };

    if(kind==="parts"){
      show(9,13);
      left.appendChild(el("p","q","לחצי על החלק שמראה את השעות."));
      let miss=0;
      right.querySelector(".dh").onclick=()=>{ right.querySelector(".dh").classList.add("ok"); SFX.ok(); track("digital",miss===0,false,miss,0);
        say("נכון! 09 זה השעה — תשע. 13 זה הדקות."); next(miss===0); };
      right.querySelector(".dm").onclick=()=>{ const d=right.querySelector(".dm"); d.classList.add("no"); SFX.oops(); miss++;
        say("זה החלק של הדקות. השעות נמצאות בצד השני של הנקודתיים."); setTimeout(()=>d.classList.remove("no"),700); };
      say("לחצי על השעות.");
    }
    else if(kind==="plus1"){
      const h=R(7,10), m=R(1,48); show(h,m);
      left.appendChild(el("p","q",`השעה ${pad(h)}:${pad(m)}. מה השעה דקה אחרי?`));
      mcq(left,shuffle([[`${pad(h)}:${pad(m+1)}`,true],[`${pad(h+1)}:${pad(m)}`,false],[`${pad(h)}:${pad(m-1)}`,false]]),
          "רמז: רק הדקות משתנות — הן עולות ב־1. השעות נשארות.",f=>{ after(h,m+1); next(f); });
    }
    else if(kind==="plus10"){
      const h=8, m=[0,10,20,30,40][R(0,4)]; show(h,m);
      left.appendChild(el("p","q",`השעה ${pad(h)}:${pad(m)}. מה השעה עשר דקות אחרי?`));
      mcq(left,shuffle([[`${pad(h)}:${pad(m+10)}`,true],[`${pad(h)}:${pad(m+1)}`,false],[`${pad(h+1)}:${pad(m)}`,false]]),
          "רמז: עשר דקות — הספרה הראשונה של הדקות עולה ב־1.",f=>{ after(h,m+10); next(f); });
    }
    else if(kind==="roll"){
      const h=rollHours.shift(); show(h,59);
      left.appendChild(el("p","q",`השעה ${pad(h)}:59. מה השעה דקה אחרי?`));
      mcq(left,shuffle([[`${pad(h)}:60`,false],[`${pad(h+1)}:00`,true],[`${pad(h)}:00`,false]]),
          "רמז: אין 60 דקות. אחרי 59 — השעה עולה ב־1, והדקות חוזרות ל־00.",
          f=>{ after(h+1,0); say(`${pad(h)}:59 ועוד דקה = ${pad(h+1)}:00. שעה חדשה!`); next(f); });
    }
    else if(kind==="roll24"){
      show(23,59);
      left.appendChild(el("p","q","השעה 23:59. מה השעה דקה אחרי?"));
      mcq(left,shuffle([["23:60",false],["24:60",false],["00:00",true]]),
          "רמז: אחרי 23:59 היממה נגמרת — ומתחיל יום חדש.",
          f=>{ after(0,0); say("00:00 — חצות. יום חדש מתחיל!"); next(f); });
    }
    else{ /* free play before finishing */
      let h=7, m=57; show(h,m);
      left.appendChild(el("p","q","מגרש משחקים: לחצי '+1 דקה' ותראי מה קורה אחרי 59."));
      const r=el("div","btn-row");
      const b1=el("button","btn sun","+1 דקה"), b10=el("button","btn ghost","+10 דקות"), fin=el("button","btn go","סיימתי ✓");
      const step=n=>{ m+=n; while(m>=60){ m-=60; h=(h+1)%24; if(h===0) say("חצות! 00:00 — יום חדש."); }
        after(h,m); SFX.tick(); if(m<n) say(`עברנו שעה! עכשיו ${pad(h)}:${pad(m)}.`); };
      b1.onclick=()=>step(1); b10.onclick=()=>step(10); fin.onclick=()=>{ LV.i++; draw(); };
      r.append(b1,b10,fin); left.appendChild(r);
      say("נסי בעצמך — מה קורה אחרי 7:59?");
    }
  }
  draw();
}

/* =====================================================================
   WEEK · TASKS · WEEKLY PLANNING  (brief §10 screens 5–6, Moti's week sketch)
   ===================================================================== */
const DAYS=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"], DAYN=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const noonOf=d=>{ const x=new Date(d); x.setHours(12,0,0,0); return x; };
const todayD=()=>{ const d=noonOf(new Date()); const off=(DEV&&DB.data.settings.devOffset)||0; if(off) d.setDate(d.getDate()+off); return d; };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const parseD=s=>{ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd,12); };
const diffD=(a,b)=>Math.round((noonOf(b)-noonOf(a))/864e5);
const dayLabel=s=>{ const d=parseD(s); return `יום ${DAYS[d.getDay()]} · ${d.getDate()}/${d.getMonth()+1}`; };
const uid=()=>Math.random().toString(36).slice(2,9);
const gate=()=>DB.data.settings.weeklyGate||{on:false,day:6};
function weekId(){ let d=todayD(); const g=gate().day; while(d.getDay()!==g) d=addD(d,-1); return ymd(d); }
function weekStart(){ let d=parseD(weekId()); while(d.getDay()!==0) d=addD(d,1); return d; }
function gateActive(){ return !!(gate().on && DB.data.settings.onboarded && !(DB.data.weekPlans||{})[weekId()]); }
const overlap=(a,b)=>{ const as=toMin(a.time),bs=toMin(b.time); return as<bs+b.dur && bs<as+a.dur; };

const TT={
  test:   {e:"📝",nm:"מבחן",       steps:["לקרוא ולסמן את החומר","לתרגל שאלות","חזרה אחרונה — ולישון טוב"]},
  project:{e:"📚",nm:"עבודה",      steps:["לאסוף חומר ורעיונות","לכתוב טיוטה","לסדר, לבדוק ולהגיש"]},
  hw:     {e:"✏️",nm:"שיעורי בית", steps:["להכין את שיעורי הבית"]},
  other:  {e:"📌",nm:"אחר",        steps:["להתחיל","לסיים"]}
};
const WEEK_LIB=[
  {nm:"חוג",e:"⚽",dur:60},{nm:"צהרון",e:"🧸",dur:180},{nm:"מורה פרטית",e:"👩‍🏫",dur:60},
  {nm:"תנועת נוער",e:"🏕️",dur:120},{nm:"נגינה",e:"🎹",dur:45},{nm:"אימון",e:"🏊",dur:60},
  {nm:"זמן משפחה",e:"👨‍👩‍👧",dur:120},{nm:"אחר",e:"📌",dur:60}
];
const EMOJIS=["⚽","🏀","🎹","🎨","📖","🏊","🤸","🥋","🎭","🕍","🐶","🧩","👨‍👩‍👧","🎻","💃","🧑‍🍳"];

/* what happens on a given date */
function itemsOn(date){
  const s=ymd(date), dow=date.getDay(), out=[];
  (DB.data.week||[]).filter(w=>w.day===dow).forEach(w=>out.push({kind:"rec",ref:w,time:w.time,dur:w.dur,nm:w.nm,e:w.e}));
  (DB.data.events||[]).filter(v=>v.date===s).forEach(v=>out.push({kind:"one",ref:v,time:v.time,dur:v.dur,nm:v.nm,e:v.e}));
  (DB.data.tasks||[]).forEach(t=>{
    if(t.due_date===s) out.push({kind:"due",ref:t,time:"",dur:0,nm:`${TT[t.type].nm}: ${t.title}`,e:TT[t.type].e});
    (t.steps||[]).forEach(st=>{ if(st.date===s) out.push({kind:"step",ref:st,task:t,time:"",dur:st.min||30,nm:`${st.title} (${t.title})`,e:st.done?"✅":"▫️"}); });
  });
  return out.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
}
const loadOf=items=>items.reduce((s,i)=>s+(i.kind==="due"?(i.ref.type==="test"?60:30):(i.dur||0)),0);
function loadBadge(min){
  if(min<90)  return {c:"#43c47f",w:Math.max(8,min/2.4),t:"עומס קל"};
  if(min<180) return {c:"#ffc43d",w:min/2.4,t:"עומס בינוני"};
  return {c:"#e8833c",w:100,t:"עומס כבד"};
}

/* ---------- the week grid (used by the week screen and by weekly planning) ---------- */
function renderWeekGrid(host,editable,rerender){
  const ws=weekStart(), tday=ymd(todayD());
  const grid=el("div","weekgrid");
  for(let i=0;i<7;i++){
    const d=addD(ws,i), s=ymd(d), items=itemsOn(d), load=loadOf(items), lb=loadBadge(load);
    const c=el("div","dayc"+(s===tday?" today":""));
    c.appendChild(el("h4",null,`יום ${DAYS[i]}<small>${d.getDate()}/${d.getMonth()+1}</small>`));
    items.forEach(it=>{
      const row=el("div","witem "+it.kind,`<span>${it.e}</span><span>${it.nm}</span>${it.time?`<span class="t">${it.time}</span>`:""}`);
      if(editable && (it.kind==="rec"||it.kind==="one")){
        const x=el("button","x","×"); x.title="הסרה";
        x.onclick=()=>{ if(it.kind==="rec") DB.data.week=DB.data.week.filter(w=>w!==it.ref); else DB.data.events=DB.data.events.filter(v=>v!==it.ref);
          DB.save(); SFX.tick(); rerender&&rerender(); };
        row.appendChild(x);
      }
      c.appendChild(row);
    });
    if(!items.length) c.appendChild(el("div","loadlbl","— פנוי —"));
    c.appendChild(el("div","loadlbl",lb.t));
    const bar=el("div","load"); bar.innerHTML=`<i style="width:${lb.w}%;background:${lb.c}"></i>`; c.appendChild(bar);
    grid.appendChild(c);
  }
  host.appendChild(grid);
  if(editable){
    const r=el("div","btn-row");
    const add=el("button","btn sun","➕ להוסיף לשבוע"); add.onclick=()=>addWeekModal(()=>rerender&&rerender());
    r.appendChild(add); host.appendChild(r);
  }
}
function weekWarnings(){
  const ws=weekStart(), out=[];
  for(let i=0;i<7;i++){
    const d=addD(ws,i), items=itemsOn(d), load=loadOf(items);
    if(load>=180) out.push(`יום ${DAYS[i]} עמוס מאוד — אולי להזיז משהו ליום פנוי יותר?`);
    const timed=items.filter(x=>x.time);
    for(let a=0;a<timed.length;a++) for(let b=a+1;b<timed.length;b++)
      if(overlap(timed[a],timed[b])) out.push(`ביום ${DAYS[i]} "${timed[a].nm}" ו"${timed[b].nm}" באותה שעה.`);
    const test=items.find(x=>x.kind==="due"&&x.ref.type==="test");
    if(test && i>0 && loadOf(itemsOn(addD(ws,i-1)))>=150) out.push(`יום לפני ה${test.nm} (יום ${DAYS[i-1]}) עמוס — כדאי להתחיל לחזור מוקדם יותר.`);
  }
  return [...new Set(out)];
}

/* ---------- tasks: add, auto-split into steps, tick off ---------- */
function autoSteps(t){
  const due=parseD(t.due_date), names=TT[t.type].steps, n=names.length, today=todayD();
  const per=Math.max(15,Math.round((t.est||60)/n/5)*5);
  t.steps=names.map((title,i)=>{ let d=addD(due,-(n-i)); if(d<today) d=today; return {id:uid(),title,date:ymd(d),min:per,done:false}; });
}
function addTaskModal(then){
  const st={type:"test"};
  const box=el("div"); box.appendChild(el("p","q","➕ מטלה חדשה"));
  const tch=el("div","chips");
  Object.entries(TT).forEach(([k,v])=>{ const b=el("button","chip2"+(k===st.type?" on":""),`${v.e} ${v.nm}`);
    b.onclick=()=>{ st.type=k; $$(".chip2",tch).forEach(y=>y.classList.remove("on")); b.classList.add("on"); }; tch.appendChild(b); });
  box.appendChild(tch);
  const f1=el("div","formrow","<label>במה? (למשל: מדעים, חשבון, עבודה על בעלי חיים)</label>"); const ti=el("input"); ti.type="text"; f1.appendChild(ti); box.appendChild(f1);
  const f2=el("div","formrow","<label>עד מתי?</label>"); const di=el("input"); di.type="date"; di.min=ymd(todayD()); di.value=ymd(addD(todayD(),4)); f2.appendChild(di); box.appendChild(f2);
  const f3=el("div","formrow","<label>כמה זמן זה ייקח בערך, בסך הכול?</label>"); const es=el("select");
  [[30,"חצי שעה"],[60,"שעה"],[90,"שעה וחצי"],[120,"שעתיים"],[180,"שלוש שעות"],[300,"יותר"]].forEach(([v,t])=>{ const o=el("option",null,t); o.value=v; if(v===90) o.selected=true; es.appendChild(o); });
  f3.appendChild(es); box.appendChild(f3);
  const r=el("div","btn-row"); const ok=el("button","btn go","שמירה וחלוקה לשלבים ✓"), no=el("button","btn ghost","ביטול");
  ok.onclick=()=>{
    const title=ti.value.trim(); if(!title){ toast("כתבו במה המטלה",true); return; }
    if(!di.value || di.value<ymd(todayD())){ toast("בחרו תאריך מהיום והלאה",true); return; }
    const t={id:uid(),title,type:st.type,due_date:di.value,est:+es.value,steps:[],done:false,created:ymd(todayD())};
    autoSteps(t); (DB.data.tasks=DB.data.tasks||[]).push(t); DB.save(); closeModal(); SFX.ok();
    toast(t.steps.length>1?`חילקנו ל־${t.steps.length} שלבים — אפשר לשנות`:"נוסף");
    then&&then();
  };
  no.onclick=closeModal; r.append(ok,no); box.appendChild(r);
  modal(box); setTimeout(()=>ti.focus(),50);
}
function taskCard(t,rerender){
  const left=diffD(todayD(),parseD(t.due_date));
  const undone=(t.steps||[]).filter(s=>!s.done).length, total=(t.steps||[]).length;
  const allDone=total>0&&!undone;
  const c=el("div","taskc"+(allDone?" done":""));
  const h=el("h3",null,`<span>${TT[t.type].e}</span><span>${TT[t.type].nm}: ${t.title}</span>`);
  const del=el("button","del","🗑️"); del.title="מחיקה";
  del.onclick=()=>confirmBox(`למחוק את "${t.title}"?`,()=>{ DB.data.tasks=DB.data.tasks.filter(x=>x!==t); DB.save(); rerender(); });
  h.appendChild(del); c.appendChild(h);
  c.appendChild(el("div","due",`עד ${dayLabel(t.due_date)} · ${allDone?"🎉 הושלם!":left>1?`עוד ${left} ימים`:left===1?"מחר!":left===0?"היום!":"התאריך עבר"} · ${total-undone}/${total} שלבים`));
  (t.steps||[]).forEach(s=>{
    const row=el("div","stp"+(s.done?" done":""));
    const cb=el("input"); cb.type="checkbox"; cb.checked=s.done;
    cb.onchange=()=>{ s.done=cb.checked; DB.save(); SFX[cb.checked?"ok":"tick"]();
      if((t.steps||[]).every(x=>x.done)){ t.done=true; DB.save(); SFX.win(); confetti(); toast(`${t.title} — הושלם! 🎉`); } else t.done=false;
      rerender(); };
    const ti=el("input","st"); ti.type="text"; ti.value=s.title; ti.onchange=()=>{ s.title=ti.value; DB.save(); };
    const di=el("input"); di.type="date"; di.value=s.date; di.onchange=()=>{ s.date=di.value; DB.save(); rerender(); };
    row.append(cb,ti,di); c.appendChild(row);
  });
  if(!allDone){
    if(left<=1 && undone>1) c.appendChild(el("div","warn","⚠️ נשאר מעט זמן ועוד כמה שלבים — כדאי להתחיל כבר היום, או לבקש עזרה."));
    if((t.steps||[]).some(s=>s.date>t.due_date)) c.appendChild(el("div","warn","⚠️ יש שלב שמתוכנן אחרי תאריך ההגשה."));
    if((t.steps||[]).some(s=>!s.done && s.date<ymd(todayD()))) c.appendChild(el("div","warn","⏰ יש שלב שהתאריך שלו כבר עבר — אפשר להזיז אותו להיום."));
  }
  return c;
}
function renderTaskList(host,filter,rerender){
  const list=(DB.data.tasks||[]).filter(filter||(()=>true)).sort((a,b)=>a.due_date.localeCompare(b.due_date));
  if(!list.length) host.appendChild(el("p","lead","אין מטלות כרגע. יש מבחן או עבודה בקרוב? מוסיפים כאן — ומקבלים חלוקה לשלבים."));
  list.forEach(t=>host.appendChild(taskCard(t,rerender)));
  const r=el("div","btn-row"); const add=el("button","btn sun","➕ מבחן, עבודה או שיעורי בית"); add.onclick=()=>addTaskModal(rerender);
  r.appendChild(add); host.appendChild(r);
}

/* ---------- the weekly planning gate ---------- */
let planStep=0;
function renderPlan(){
  const h=$("#planBody"); h.innerHTML="";
  h.appendChild(el("div","plansteps",[0,1,2].map(i=>`<span class="${i<=planStep?"on":""}"></span>`).join("")));
  const ws=weekStart(), we=addD(ws,6), nm=DB.data.child.name;
  const nav=(back,nextLabel,onNext)=>{ const r=el("div","btn-row");
    const n=el("button","btn go",nextLabel); n.onclick=onNext; r.appendChild(n);
    if(back){ const b=el("button","btn ghost","◂ חזרה"); b.onclick=()=>{ planStep--; renderPlan(); }; r.appendChild(b); }
    if(DEV){ const sk=el("button","btn ghost","דילוג (מצב בודק)"); sk.onclick=finishPlan; r.appendChild(sk); }
    h.appendChild(r); };
  if(planStep===0){
    h.appendChild(el("h2",null,`🗓️ ${nm?nm+", ":""}שבוע חדש — בואו נתכנן`));
    h.appendChild(el("p","lead",`פעם בשבוע מתכננים את השבוע, ורק אחר כך ממשיכים למשחק. שלב 1 מתוך 3: מה קבוע השבוע? חוגים, צהרון, מורה פרטית, תנועת נוער… (${dayLabel(ymd(ws))} עד ${dayLabel(ymd(we))})`));
    renderWeekGrid(h,true,renderPlan);
    nav(false,"המשך ▸",()=>{ planStep=1; renderPlan(); });
  }else if(planStep===1){
    h.appendChild(el("h2",null,"📝 מבחנים, עבודות ושיעורי בית"));
    h.appendChild(el("p","lead","שלב 2 מתוך 3: יש השבוע או בשבוע הבא מבחן או עבודה להגשה? מוסיפים — והמערכת מחלקת לשלבים על פני הימים שלפני. אפשר לשנות כל שלב."));
    const horizon=ymd(addD(we,7));
    renderTaskList(h,t=>t.due_date>=ymd(todayD())&&t.due_date<=horizon,renderPlan);
    nav(true,"המשך ▸",()=>{ planStep=2; renderPlan(); });
  }else{
    h.appendChild(el("h2",null,"✅ בדיקה אחרונה"));
    h.appendChild(el("p","lead","שלב 3 מתוך 3: ככה נראה השבוע. הצבע מראה כמה עמוס כל יום."));
    renderWeekGrid(h,false);
    const w=weekWarnings();
    if(w.length) w.forEach(x=>h.appendChild(el("div","warn","⚠️ "+x)));
    else h.appendChild(el("div","good-box","👍 השבוע נראה מאוזן — אין התנגשויות ואין יום עמוס מדי."));
    nav(true,"סיימתי לתכנן את השבוע ✓",finishPlan);
  }
  h.appendChild(el("p","parent-note",`להורים: התכנון השבועי נפתח כל יום ${DAYN[gate().day]}. אפשר לכבות או לשנות יום במסך ההורה.`));
  say(["מה קבוע השבוע? מוסיפים חוגים ומסגרות.","יש מבחנים או עבודות? מוסיפים — ונחלק לשלבים.","עוד בדיקה אחת — ומסיימים."][planStep]);
}
function finishPlan(){

const SKILL_OF={line:"day_line",digital:"digital",twelve:"twelve",cycle:"day_night",pie:"fractions",hands:"hands",
  round:"read_round",half:"read_half",quarter:"read_quarter",five:"read_five",week:"week",plan:"planning"};

  hands:"המחוגים",read_round:"קריאת שעות עגולות",read_half:"קריאת 'וחצי'",read_quarter:"קריאת 'רבע' ו'רבע ל'",
  read_five:"קריאה בקפיצות של 5",set_clock:"כיוון שעון",week:"ימי השבוע",planning:"תכנון ומטלות",transfer:"זמן בחיים האמיתיים"};
const INT=[1,1,3,7,14];                       /* box → days until the next review */
function track(skill,first,hint,tries,rt){
  if(!skill) return;
  const S=(DB.data.skills=DB.data.skills||{}), today=ymd(todayD());
  const s=S[skill]||(S[skill]={score:0,n:0,box:0,next:null,last:null,boxDay:null,hist:[]});
  let w = (first&&!hint) ? 1 : tries<=1 ? .6 : tries===2 ? .4 : .2;   /* first try 100 · after a hint/1 miss 60 · 2 misses 40 · more 20 */
  if(first && rt>25) w*=.85;                                         /* slow answers count a little less (weak signal) */
  s.score=Math.max(0,Math.min(100,Math.round(s.score+0.35*(w*100-s.score))));
  s.n++;
  if(!s.firstDay) s.firstDay=today;
  if(s.firstDay===today) s.firstScore=s.score;      /* "first day" baseline for the pilot report */
  if(first&&!hint){ if(s.boxDay!==today){ s.box=Math.min(4,s.box+1); s.boxDay=today; } }  /* climbs at most once a day */
  else { s.box=0; s.boxDay=today; }
  s.next=ymd(addD(todayD(),INT[s.box])); s.last=today;
  (s.hist=s.hist||[]).push({d:today,f:first?1:0,h:hint?1:0,t:tries,rt:Math.round(rt||0)});
  if(s.hist.length>20) s.hist.shift();
  DB.save();
}

function pickMission(){
  const t=ymd(todayD()), g=DB.data.child.grade||0;
  for(const task of (DB.data.tasks||[]).filter(x=>!x.done).sort((a,b)=>a.due_date.localeCompare(b.due_date))){
    const st=(task.steps||[]).find(s=>!s.done && s.date<=t); if(st) return {day:t,type:"step",task,step:st};
  }
  const due=Object.entries(DB.data.skills||{}).filter(([,s])=>s.next&&s.next<=t).sort((a,b)=>a[1].score-b[1].score).map(([k])=>k);
  if(due.length){ const sk=due.slice(0,3); while(sk.length<3) sk.push(sk[0]); return {day:t,type:"review",skills:sk}; }
  if(todayD().getDay()===2 && g>=4 && !Object.values(DB.data.daily||{}).some(d=>d.type==="challenge"&&d.week===weekKey())) return {day:t,type:"challenge"};
  const nx=nextLevel(), young=g<=2 && !prog("five")?.done;

}

  const finish=(type,msg)=>{
    completeDaily(type); SFX.win(); confetti(); TODAY_M=null;
    h.innerHTML=""; h.appendChild(el("h2",null,`☀️ היום של ${c.name||""}`));
    h.appendChild(el("div","good-box",msg)); h.appendChild(weekStory());
    const r=el("div","btn-row"); const b=el("button","btn go","קדימה למפה ▸"); b.onclick=()=>{ renderMap(); go("map"); };
    r.appendChild(b); h.appendChild(r); say(msg);
  };
  const young=(c.grade||0)>0 && c.grade<=2;
  /* v11 חבילה 1: לכיתות א׳–ב׳ — כפתור אחד "מתחילים יחד". שום שאלה לא מופיעה לפני שהילדה לחצה */
  const startBtn=(go)=>{ const r=el("div","btn-row"); const b=el("button","btn sun wide start","▶ מתחילים יחד");
    b.onclick=()=>{ r.remove(); go(); }; r.appendChild(b); body.appendChild(r); return b; };
  if(m.type==="step"){
    const t=m.task;
    body.appendChild(el("div","mission",`⏳ יש לך 3 דקות: בדיקת מטלה שמתקרבת.`));
    body.appendChild(el("p","q",`📝 ${m.step.title}`));
    body.appendChild(el("p","lead",`בשביל: ${TT[t.type].nm} — ${t.title} · עד ${dayLabel(t.due_date)}. עשית את השלב הזה?`));
    const r=el("div","btn-row");
    const yes=el("button","btn go","✅ עשיתי"), no=el("button","btn ghost","⏰ עוד לא — נעביר למחר");
    yes.onclick=()=>{ m.step.done=true; if((t.steps||[]).every(s=>s.done)) t.done=true; DB.save(); track("planning",true,false,0,0);
      finish("step",t.done?`🎉 ${t.title} — כל השלבים הושלמו!`:"💪 עוד שלב מאחוריך. ככה מגיעים מוכנים."); };
    no.onclick=()=>{ m.step.date=ymd(addD(todayD(),1)); DB.save(); track("planning",false,false,1,0);
      finish("step",m.step.date>=t.due_date?"⚠️ העברנו למחר — אבל מחר זה כבר יום ההגשה. כדאי להתחיל היום, אפילו קצת.":"🙂 בסדר — העברנו למחר. רק לא לדחות שוב."); };
    r.append(yes,no); body.appendChild(r);
    say(`עשית את השלב "${m.step.title}"?`);
  }
  else if(m.type==="station"){
    body.appendChild(el("div","mission",young?`🧭 היום: ${m.lvl.ic} ${m.lvl.nm}.`:"🧭 המשימה של היום: התחנה הבאה במסע."));
    const b=el("button","btn sun wide"+(young?" start":""),young?"▶ מתחילים יחד":`${m.lvl.ic} ${m.lvl.nm} — יוצאים לדרך ▸`);
    b.onclick=()=>{ completeDaily("station"); TODAY_M=null; openLevel(m.lvl.id); };
    const r=el("div","btn-row"); r.appendChild(b); body.appendChild(r);
    say(young?`היום: ${m.lvl.nm}. לוחצים על מתחילים יחד.`:`המשימה של היום: ${m.lvl.nm}.`);
  }
  else{
    const intro={review:"🔁 יש לך 3 דקות: בואו נבדוק שזה עדיין זכור.",transfer:"🧭 יש לך 3 דקות: זמן בחיים האמיתיים.",
                 challenge:"🎯 יום מאתגר! תרחיש אחד — מה הכי נכון לעשות?"}[m.type];
    body.appendChild(el("div","mission",intro));
    let qs;
    if(m.type==="review") qs=m.skills.map(genFor);
    else if(m.type==="challenge") qs=[genChallenge()];
    else { const a=genTransfer(); let b=genTransfer(), k=0; while(b.q===a.q&&k++<10) b=genTransfer(); qs=[a,b]; }
    const run=()=>runQs(body,qs,(ok,n)=>finish(m.type, ok===n?`🌟 ${ok} מתוך ${n} בניסיון ראשון — מצוין!`:`👍 ${ok} מתוך ${n} בניסיון ראשון. מה שהיה קשה — נחזור עליו בקרוב.`));
    if(young){ startBtn(run); say(intro.replace(/^\S+\s/,"")+" לוחצים על מתחילים יחד."); }
    else run();
  }
  footer.appendChild(weekStory());
  const skip=el("button","linkbtn",young?"🗺️ למפת המסע":"אחר כך"); skip.onclick=()=>{ SKIP_TODAY=ymd(todayD()); renderMap(); go("map"); };
  footer.appendChild(skip);
}

/* =====================================================================
   VOICE — Hebrew text-to-speech (Web Speech API)
   ===================================================================== */
const VOICE={he:null,all:0,lastErr:null};
function loadVoices(){
  try{ const vs=window.speechSynthesis.getVoices()||[]; VOICE.all=vs.length;
    VOICE.he=vs.find(v=>/^(he|iw)/i.test(v.lang))||vs.find(v=>/hebrew|עברית/i.test(v.name))||null; }catch(e){}
  try{ document.body.classList.toggle("novoice",!VOICE.he); }catch(e){}
}
if("speechSynthesis" in window){
  loadVoices();
  try{ window.speechSynthesis.addEventListener("voiceschanged",loadVoices); }catch(e){}
  let k=0; const iv=setInterval(()=>{ loadVoices(); if(VOICE.he || ++k>12) clearInterval(iv); },400);   /* some browsers never fire voiceschanged */
}else{ try{ document.body.classList.add("novoice"); }catch(e){} }
function voiceMode(){ try{ return DB.data.settings.voice || ((DB.data.child.grade||0)<=2?"auto":"button"); }catch(e){ return "button"; } }
function cleanSpeech(text){
  return String(text).replace(new RegExp("["+NQ_MARKS+"]","g"),"").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F\u200D]/gu,"").replace(/[▸◂▲▼✓×⣿]/g,"").replace(/\s+/g," ").trim();
}
let UTT=null;                                   /* keep a reference: Chromium may drop un-referenced utterances */
function speak(text,force,hooks){
  if(!("speechSynthesis" in window)) return false;
  if(!VOICE.he) loadVoices();
  if(!VOICE.he){ if(force) toast("הקראה לא זמינה בדפדפן הזה. נסו Microsoft Edge, או התקינו קול עברי.",true); return false; }
  const t=cleanSpeech(text); if(!t) return false;
  const sp=window.speechSynthesis;
  try{ if(sp.speaking||sp.pending) sp.cancel(); if(sp.resume) sp.resume(); }catch(e){}
  const u=new SpeechSynthesisUtterance(t); UTT=u;
  u.voice=VOICE.he; u.lang=VOICE.he.lang; u.rate=.92;
  u.onstart=()=>{ VOICE.lastErr=null; hooks&&hooks.start&&hooks.start(); };
  u.onerror=e=>{ const er=(e&&e.error)||"error"; if(er==="interrupted"||er==="canceled") return;
    VOICE.lastErr=er; hooks&&hooks.error&&hooks.error(er); if(force&&!hooks) toast("ההקראה נכשלה ("+er+")",true); };
  setTimeout(()=>{ try{ sp.speak(u); }catch(e){ VOICE.lastErr=String(e); } },80);   /* cancel()+speak() in the same tick is dropped by Chromium */
  return true;
}
function voiceDiagnosis(){
  if(!("speechSynthesis" in window)) return "❌ הדפדפן הזה לא תומך בהקראה בכלל.";
  if(VOICE.he) return `✅ נמצא קול עברי: ${VOICE.he.name}.`;
  const brave=!!(navigator.brave);
  return `❌ לא נמצא קול עברי — נמצאו ${VOICE.all} קולות בסך הכול.`+
    (brave?" אתם ב־Brave, שעשוי להגביל את רשימת הקולות כהגנת פרטיות.":"")+
    " הפתרון: לפתוח את המשחק ב־Microsoft Edge (יש בו קולות עבריים מובנים), או להתקין קול עברי ב־Windows: הגדרות ← זמן ושפה ← דיבור ← הוספת קולות ← עברית. עד אז כפתורי 🔊 מוסתרים.";
}
try{ $(".owl").onclick=()=>speak($("#bubble").textContent,true); }catch(e){}

/* =====================================================================
   PILOT REPORT — anonymous summary the parent copies and sends
   ===================================================================== */
function pilotReport(){
  const d=DB.data, c=d.child, t=ymd(todayD());
  if(!d.settings.pilotId){ d.settings.pilotId=Math.random().toString(36).slice(2,6).toUpperCase(); DB.save(); }
  const daily=d.daily||{}, keys=Object.keys(daily).sort(), start=keys[0]||t;
  const span=Math.max(1,diffD(parseD(start),todayD())+1);
  const doneDays=Object.values(daily).filter(x=>x.done).length;
  const last14=[...Array(14)].map((_,i)=>((daily[ymd(addD(todayD(),i-13))]||{}).done?"✓":"·")).join("");
  const TN={step:"מטלה",review:"חזרה",challenge:"יום מאתגר",transfer:"זמן בחיים",station:"תחנה",plan:"תכנון שבועי",onboarding:"הרשמה"};
  const types={}; Object.values(daily).forEach(x=>{ if(x.done&&x.type) types[x.type]=(types[x.type]||0)+1; });
  const main=LEVELS.filter(l=>!l.bonus), st=main.filter(l=>prog(l.id)?.done);
  const sk=Object.entries(d.skills||{}).sort((a,b)=>a[1].score-b[1].score);
  const tasks=d.tasks||[], tDone=tasks.filter(x=>x.done).length;
  const lines=[
    "📤 דוח פיילוט — סיפור של יממה",
    `קוד משפחה: ${d.settings.pilotId} · כיתה ${c.grade?GRADES[c.grade-1][0]:"?"} · ${c.gender==="m"?"בן":"בת"}`,
    `${dayLabel(t)} · יום ${span} בפיילוט (התחלה: ${dayLabel(start)})`,
    "",
    `☀️ מסע היום: ${doneDays} ימים מתוך ${span}`,
    `14 הימים האחרונים (ישן ← חדש): ${last14}`,
    `סוגי משימות: ${Object.entries(types).map(([k,v])=>`${TN[k]||k} ${v}`).join(", ")||"—"}`,
    "",
    `🗺️ תחנות שהושלמו: ${st.length} מתוך ${main.length}${st.length?" ("+st.map(l=>l.nm).join(", ")+")":""}`,
    "",
    "🎯 שליטה במיומנויות (יום ראשון ← היום):",
    ...(sk.length?sk.map(([k,v])=>`• ${SKILLN[k]||k}: ${v.firstScore!=null?v.firstScore:"—"} ← ${v.score} · ${mLabel(v.score)} · ${v.n} תשובות`):["• עוד אין נתונים"]),
    "",
    `📝 מטלות: ${tasks.length} נוצרו, ${tDone} הושלמו · תכנונים שבועיים: ${Object.keys(d.weekPlans||{}).length}`,
    `🗣️ קול: ${({auto:"הקראה אוטומטית",button:"בלחיצה",off:"כבוי"})[voiceMode()]} · קול עברי ${VOICE.he?"זמין":"לא זמין"}`,
    "",
    "—— נתונים לניתוח ——",
    JSON.stringify(pilotData())
  ];
  return lines.join("\n");
}
function pilotData(){
  const d=DB.data, c=d.child, t=ymd(todayD());
  if(!d.settings.pilotId){ d.settings.pilotId=Math.random().toString(36).slice(2,6).toUpperCase(); DB.save(); }
  const daily=d.daily||{}, keys=Object.keys(daily).sort(), start=keys[0]||t;
  const span=Math.max(1,diffD(parseD(start),todayD())+1);
  const last14=[...Array(14)].map((_,i)=>((daily[ymd(addD(todayD(),i-13))]||{}).done?"✓":"·")).join("");
  const types={}; Object.values(daily).forEach(x=>{ if(x.done&&x.type) types[x.type]=(types[x.type]||0)+1; });
  const st=LEVELS.filter(l=>!l.bonus&&prog(l.id)?.done), tasks=d.tasks||[];
  const sk=Object.entries(d.skills||{}).sort((a,b)=>a[1].score-b[1].score);
  return {v:1,id:d.settings.pilotId,g:c.grade,s:c.gender,start,span,daily:Object.values(daily).filter(x=>x.done).length,last14,types,
    days:keys.filter(k=>daily[k].done).slice(-60),
    stations:st.map(l=>l.id),skills:Object.fromEntries(sk.map(([k,v])=>[k,[v.firstScore!=null?v.firstScore:null,v.score,v.n,v.box]])),
    tasks:[tasks.length,tasks.filter(x=>x.done).length],plans:Object.keys(d.weekPlans||{}).length,voice:[voiceMode(),!!VOICE.he]};
}
function openPilotReport(){
  const txt=pilotReport();
  const box=el("div");
  box.appendChild(el("p","q","📤 דוח פיילוט"));
  box.appendChild(el("p","lead","הדוח לא כולל את שם הילד. העתיקו אותו ושלחו למי שמנהל את הפיילוט — למשל בוואטסאפ."));
  const ta=el("textarea","report"); ta.readOnly=true; ta.value=txt; box.appendChild(ta);
  const r=el("div","btn-row");
  const cp=el("button","btn go","📋 העתקה");
  cp.onclick=async()=>{ let ok=false;
    try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){}
    if(!ok){ try{ ta.select(); ok=document.execCommand("copy"); }catch(e){} }
    toast(ok?"הדוח הועתק — אפשר להדביק ולשלוח":"סמנו את הטקסט והעתיקו ידנית",!ok); };
  r.appendChild(cp);
  if(navigator.share){ const sh=el("button","btn ghost","📤 שיתוף"); sh.onclick=()=>navigator.share({title:"דוח פיילוט — סיפור של יממה",text:txt}).catch(()=>{}); r.appendChild(sh); }
  const cl=el("button","btn ghost","סגירה"); cl.onclick=closeModal; r.appendChild(cl);
  box.appendChild(r); modal(box);
}
$("#pilotBtn").onclick=openPilotReport;

/* =====================================================================
   CLOUD — anonymous pilot sync (Supabase). Inert until CLOUD.url is set.
   Sends only pilotData() (no name). Needs parent consent. Never in tester mode.
   ===================================================================== */
const CLOUD={url:"",key:"",table:"pilot_snapshots",ver:"v11"};
const cloudOn=()=>!!(CLOUD.url&&CLOUD.key);
function deviceId(){
  const s=DB.data.settings;
  if(!s.deviceId){ const a=new Uint8Array(9); try{ crypto.getRandomValues(a); }catch(e){ a.forEach((_,i)=>a[i]=Math.random()*256|0); }
    s.deviceId=[...a].map(x=>x.toString(16).padStart(2,"0")).join(""); DB.save(); }
  return s.deviceId;
}
function cloudSync(reason,force){
  const s=DB.data.settings;
  if(!cloudOn()||DEV||s.consent!==true||!s.onboarded) return Promise.resolve(false);
  const now=Date.now();
  if(!force && s.lastSync && now-s.lastSync<60*60*1000) return Promise.resolve(false);
  s.lastSync=now; DB.save();
  const body=JSON.stringify({device_id:deviceId(),pilot_id:pilotData().id,app_version:CLOUD.ver,reason:reason||"",payload:pilotData()});
  try{
    return fetch(CLOUD.url.replace(/\/$/,"")+"/rest/v1/"+CLOUD.table,{method:"POST",keepalive:true,
      headers:{"Content-Type":"application/json",apikey:CLOUD.key,Authorization:"Bearer "+CLOUD.key,Prefer:"return=minimal"},body})
      .then(r=>{ if(!r.ok){ s.lastSync=0; DB.save(); } return r.ok; })
      .catch(()=>{ s.lastSync=0; DB.save(); return false; });
  }catch(e){ s.lastSync=0; DB.save(); return Promise.resolve(false); }
}
function askConsent(){
  if(!cloudOn()||DEV) return;
  const box=el("div");
  box.appendChild(el("p","q","👨‍👩‍👧 להורים — שיתוף נתונים לפיילוט"));
  box.appendChild(el("p","lead","כדי לשפר את המשחק, הוא יכול לשלוח באופן אוטומטי נתונים אנונימיים: כיתה, אילו תחנות הושלמו, הצלחה בכל מיומנות ובאילו ימים נכנסו. בלי שם ובלי שום פרט מזהה. אפשר לבטל בכל רגע במסך ההורה."));
  const r=el("div","btn-row");
  const y=el("button","btn go","✅ מאשרים");
  y.onclick=()=>{ DB.data.settings.consent=true; DB.save(); closeModal(); cloudSync("consent",true); toast("תודה! הנתונים יישלחו באופן אנונימי"); };
  const n=el("button","btn ghost","לא עכשיו");
  n.onclick=()=>{ DB.data.settings.consent=false; DB.save(); closeModal(); };
  r.appendChild(y); r.appendChild(n); box.appendChild(r); modal(box);
}

/* ---------- tester helpers ---------- */
function makeTestProfile(){
  const c=DB.data.child;
  Object.assign(c,{name:"בודק",gender:c.gender||"f",grade:c.grade||4,age:9,avatar:"🛠️",known:[],start:"line",level:"line"});
  DB.data.settings.onboarded=true; DB.save(); paintTop();
}
function fillSample(){
  const ws=weekStart();
  DB.data.daily_schedule=[["07:00","wake_up",30],["07:30","breakfast",20],["08:00","school",300],["16:00","homework",45],
    ["17:00","hobby",60],["19:00","dinner",40],["20:00","shower",20],["20:30","bedtime",30]].map(([time,activity,d])=>({time,activity,duration_minutes:d}));
  DB.data.week=[{day:1,time:"16:30",dur:60,nm:"מורה פרטית",e:"👩‍🏫"},{day:2,time:"17:00",dur:60,nm:"חוג כדורגל",e:"⚽"},
    {day:3,time:"18:00",dur:120,nm:"תנועת נוער",e:"🏕️"},{day:4,time:"17:00",dur:60,nm:"חוג כדורגל",e:"⚽"}].map(x=>({id:uid(),...x}));
  const mk=(title,type,dueOff,est)=>{ const t={id:uid(),title,type,due_date:ymd(addD(ws,dueOff)),est,steps:[],done:false,created:ymd(todayD())}; autoSteps(t); return t; };
  DB.data.tasks=[mk("מדעים","test",3,90),mk("עבודה על בעלי חיים","project",5,180)];
  DB.save();
}

/* =====================================================================
   BOOT
   ===================================================================== */
paintMute(); paintTop();
if(DEV && !DB.data.settings.onboarded) makeTestProfile();
if(DB.data.settings.onboarded){
  renderMap(); go("map");
  if(DB.data.settings.consent===undefined) setTimeout(askConsent,1500); else cloudSync("open");
  /* v11: אם נפתח מסך "היום", הוא כבר אמר מה עושים — לא לדרוס אותו. בכיתות א׳–ב׳ אין "בחרי במפה" — יש כפתור אחד */
  const young=(DB.data.child.grade||0)>0 && DB.data.child.grade<=2;
  if(!$("#scr-today").classList.contains("on"))
    say(young&&nextLevel() ? `שלום ${DB.data.child.name}! לוחצים על מתחילים יחד.` : `שלום ${DB.data.child.name}! בחרי תחנה במפה.`);
}else{
  renderOb(); go("onboard");
}
